name: Desktop installers

# Builds unsigned Folio installers for macOS (Apple Silicon and Intel) and Windows.
# Download them from the run's Artifacts section. Installers are built only on request
# (Actions tab > Run workflow, any branch) or for a version tag, never on pull requests.
# A version tag also publishes them as a GitHub Release. To rebuild the installers for an
# existing release, run the workflow by hand with that release's tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the installers to this existing release (for example v0.1.0); leave empty to only build
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    # Attach the installers to a GitHub Release: for a version tag, or for the release named
    # when the workflow is run by hand.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # The Windows installers arrive in msi/ and nsis/ subfolders.
          files: installers/**/*
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
