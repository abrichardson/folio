[package]
name = "folio"
version = "0.1.0"
description = "Folio personal finance"
edition = "2021"
publish = false

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher (encrypted SQLite) with OpenSSL compiled in, so installers need no system libraries.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
